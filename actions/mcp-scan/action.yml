name: 'MCP Tool-Poisoning Scan'
description: 'Static scan of an MCP server (URL or tools/list JSON) for tool poisoning, hidden unicode and prompt-injection. Fails the build on a block verdict.'
branding:
  icon: shield
  color: gray-dark
inputs:
  url:
    description: 'Streamable-HTTP MCP endpoint (e.g. https://host/mcp). Must answer initialize/tools/list over POST.'
    required: false
  tools-file:
    description: 'Path to a JSON file holding the "tools" array from tools/list (for stdio or private servers; only tool metadata leaves the runner).'
    required: false
  fail-on:
    description: 'Verdict that fails the job: block (default), review, or never.'
    required: false
    default: 'block'
  directory:
    description: 'Also check readiness for the Anthropic Claude Connector Directory published review criteria (free teaser: ready + blocker count). Set to "true" for connector authors submitting to the directory.'
    required: false
    default: 'false'
  endpoint:
    description: 'Scanner base URL.'
    required: false
    default: 'https://x402-data-api.sigrunner.workers.dev'
  sarif:
    description: 'Upload results to GitHub code scanning (Security tab) as SARIF 2.1.0. Requires "security-events: write" on the job and a public repo or GitHub Advanced Security.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to upload SARIF to the code-scanning REST API. Defaults to the job token.'
    required: false
    default: ${{ github.token }}
  commit-badge:
    description: 'When "true", insert/update the injection-security badge between <!-- grsg-badge:start --> and <!-- grsg-badge:end --> in README.md and commit it. Default false. Degrade-open: a commit failure never fails the build.'
    required: false
    default: 'false'
  readme:
    description: 'Path to the README to update when commit-badge=true.'
    required: false
    default: 'README.md'
outputs:
  verdict:
    description: 'clear | review | block'
    value: ${{ steps.scan.outputs.verdict }}
  risk-score:
    description: '0-100'
    value: ${{ steps.scan.outputs.risk }}
  grade:
    description: 'A-F Grey Ridge MCP security grade'
    value: ${{ steps.scan.outputs.grade }}
  badge-url:
    description: 'shields.io badge image URL (injection-security grade | verdict)'
    value: ${{ steps.scan.outputs.badge_url }}
  badge-markdown:
    description: 'Copy-paste Markdown — the badge linked to the server''s live security report'
    value: ${{ steps.scan.outputs.badge_md }}
  scorecard-url:
    description: 'Per-server live security report / funnel page (always resolves)'
    value: ${{ steps.scan.outputs.report_url }}
  sarif-file:
    description: 'Path to the generated SARIF file (when sarif=true).'
    value: ${{ steps.scan.outputs.sarif_file }}
  directory-ready:
    description: 'true | false — passes the published Claude Connector Directory criteria on static checks (only when directory=true)'
    value: ${{ steps.scan.outputs.dir_ready }}
  directory-blockers:
    description: 'Count of published-criteria blockers (only when directory=true)'
    value: ${{ steps.scan.outputs.dir_blockers }}
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        IN_URL: ${{ inputs.url }}
        IN_FILE: ${{ inputs.tools-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        WANT_DIR: ${{ inputs.directory }}
        WANT_SARIF: ${{ inputs.sarif }}
        GH_TOKEN: ${{ inputs.github-token }}
        EP: ${{ inputs.endpoint }}
        COMMIT_BADGE: ${{ inputs.commit-badge }}
        README_PATH: ${{ inputs.readme }}
      run: |
        set -euo pipefail
        dir_q=""; [ "$WANT_DIR" = "true" ] && dir_q="&directory=true"
        if [ -n "$IN_FILE" ]; then
          body=$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));t=d.get("tools",d) if isinstance(d,dict) else d;want=sys.argv[2]=="true";print(json.dumps({"tools":t,"directory":True} if want else {"tools":t}))' "$IN_FILE" "$WANT_DIR")
          out=$(curl -sS -m 60 -X POST "$EP/scan/mcp/preview" -H 'content-type: application/json' -d "$body")
        elif [ -n "$IN_URL" ]; then
          out=$(curl -sS -m 60 -G "$EP/scan/mcp/preview" --data-urlencode "url=$IN_URL" ${dir_q:+--data-urlencode "directory=true"})
        else
          echo "::error::set either url or tools-file"; exit 2
        fi
        echo "$out"
        verdict=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1]).get("verdict","error"))' "$out")
        risk=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1]).get("risk_score",-1))' "$out")
        grade=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1]).get("grade") or "?")' "$out" 2>/dev/null || echo "?")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; echo "risk=$risk" >> "$GITHUB_OUTPUT"; echo "grade=$grade" >> "$GITHUB_OUTPUT"
        # --- injection-security README badge (degrade-open: never fails the build) ---
        case "$grade" in
          A) color=brightgreen;; B) color=green;; C) color=yellow;; D) color=orange;; F) color=red;;
          *) case "$verdict" in clear) color=brightgreen;; review) color=yellow;; block) color=red;; *) color=lightgrey;; esac;;
        esac
        gdisp="$grade"; [ "$gdisp" = "?" ] && gdisp="n%2Fa"
        badge_url="https://img.shields.io/badge/MCP%20injection--security-${gdisp}%20%7C%20${verdict:-unknown}-${color}"
        badge_target="${IN_URL:-}"
        enc_url=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$badge_target" 2>/dev/null || printf '%s' "$badge_target")
        report_url="$EP/scan/mcp-scanner?url=${enc_url}"
        badge_md="[![MCP injection-security](${badge_url})](${report_url})"
        { echo "badge_url=$badge_url"; echo "report_url=$report_url"; echo "badge_md=$badge_md"; } >> "$GITHUB_OUTPUT"
        {
          echo "### MCP scan: grade **$grade** — **$verdict** (risk $risk/100)"
          echo ""
          echo "Copy this injection-security badge into your README (links to the live report):"
          echo ""
          echo '```markdown'
          echo "$badge_md"
          echo '```'
          echo ""
          echo "Itemized findings with evidence and OWASP mapping: x402 \`GET $EP/scan/mcp?url=...\` (\$0.05 USDC on Base). Measured accuracy and corpus size: https://github.com/rezearcher/x402-data-api/tree/main/benchmarks"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMIT_BADGE" = "true" ] && [ -n "$badge_target" ]; then
          set +e
          BADGE_MD="$badge_md" README_PATH="$README_PATH" python3 "$GITHUB_ACTION_PATH/badge_insert.py"; rc=$?
          if [ "$rc" = "0" ]; then
            git config user.name "grsg-badge[bot]"; git config user.email "badge@greyridgesignals.ai"
            git add "$README_PATH"
            if git commit -m "chore: update MCP injection-security badge [skip ci]"; then
              git push && echo "::notice::committed badge to $README_PATH" || echo "::warning::badge committed locally but push failed — markdown is in the step summary"
            fi
          elif [ "$rc" = "10" ]; then echo "::notice::README badge already current"
          else echo "::warning::could not update $README_PATH (rc=$rc) — copy the markdown from the step summary"; fi
          set -e
        fi
        if [ "$WANT_DIR" = "true" ]; then
          dir_ready=$(python3 -c 'import json,sys;d=json.loads(sys.argv[1]).get("directory_readiness",{});print(str(d.get("ready","")).lower())' "$out")
          dir_blk=$(python3 -c 'import json,sys;d=json.loads(sys.argv[1]).get("directory_readiness",{});print(d.get("blocker_count",-1))' "$out")
          echo "dir_ready=$dir_ready" >> "$GITHUB_OUTPUT"; echo "dir_blockers=$dir_blk" >> "$GITHUB_OUTPUT"
          {
            if [ "$dir_ready" = "true" ]; then
              echo "### Claude Connector Directory: **ready** (0 blockers on published criteria)"
              echo ""
              echo "No structural blockers against the published review criteria on static checks. Not checked here: privacy policy, OAuth 2.0, DNS ownership."
            else
              echo "### Claude Connector Directory: **${dir_blk} blocker(s)** would likely fail review"
              echo ""
              echo "The directory review queue runs ~20 days, so a rejection is expensive. This teaser hides WHICH criteria fail — get the itemized blocker list + remediation: \`POST $EP/scan/mcp {\"directory\":true}\` (zero egress, \$0.05 USDC on Base)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$WANT_SARIF" = "true" ]; then
          target="${IN_URL:-${IN_FILE:-mcp-server}}"
          SCAN_JSON="$out" SARIF_TARGET="$target" python3 "$GITHUB_ACTION_PATH/sarif.py" > greyridge-mcp.sarif
          echo "sarif_file=greyridge-mcp.sarif" >> "$GITHUB_OUTPUT"
          echo "::notice::SARIF written to greyridge-mcp.sarif ($(wc -c < greyridge-mcp.sarif) bytes)"
          if [ -n "${GH_TOKEN:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
            b64=$(gzip -c greyridge-mcp.sarif | base64 -w0)
            payload=$(SARIF_B64="$b64" python3 -c 'import json,os;print(json.dumps({"commit_sha":os.environ["GITHUB_SHA"],"ref":os.environ["GITHUB_REF"],"sarif":os.environ["SARIF_B64"]}))')
            code=$(curl -sS -o /tmp/grg_sarif_resp.json -w '%{http_code}' -X POST \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload" || echo "000")
            if [ "$code" = "202" ]; then
              echo "::notice::Uploaded SARIF to code scanning — findings will appear in the repo Security tab."
            else
              echo "::warning::SARIF upload returned HTTP $code (needs 'security-events: write' on the job plus a public repo or GitHub Advanced Security). The CI gate still works; see the step summary above."
            fi
          fi
        fi
        case "$FAIL_ON" in
          never) exit 0;;
          review) [ "$verdict" = "clear" ] || { echo "::error::MCP scan verdict $verdict"; exit 1; };;
          *) [ "$verdict" != "block" ] || { echo "::error::MCP scan verdict block"; exit 1; };;
        esac
