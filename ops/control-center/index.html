<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grey Ridge · Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1522; --panel:#16202E; --panel2:#1B2838; --line:#243245;
    --txt:#C9D4E0; --muted:#6E8099; --jade:#54B98A; --amber:#E8B04B; --cyan:#5BC9D6; --rust:#D4694A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1500px;margin:0 auto;padding:16px}
  .bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border:1px solid var(--line);
       background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:10px;padding:14px 18px}
  .brand{font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand .r{color:var(--amber)}
  .chain{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .node{padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);transition:.3s}
  .node.active{color:var(--ink);background:var(--jade);border-color:var(--jade);font-weight:600}
  .node.rest{color:var(--amber);border-color:#3a3320}
  .node.rest.active{background:var(--amber);color:var(--ink)}
  .arrow{color:var(--muted)}
  .lamps{display:flex;gap:18px;margin-left:auto;align-items:center}
  .lamp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .lamp b{color:var(--txt);font-weight:500}
  .dot{width:11px;height:11px;border-radius:50%;background:#33404f}
  .lamp.on .dot{background:var(--jade);box-shadow:0 0 10px rgba(84,185,138,.7)}
  .ring{width:14px;height:14px;border-radius:50%;border:2px solid #33404f;position:relative}
  .lamp.on .ring{border-color:var(--jade)} .lamp.on .ring:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--jade)}
  .rev{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .rev b{color:var(--txt)} .rev .pos{color:var(--jade)}
  .mon{display:flex;align-items:center;gap:9px}
  .toggle{width:46px;height:24px;border-radius:999px;background:#2a3645;border:1px solid var(--line);position:relative;cursor:pointer;transition:.25s}
  .toggle.on{background:var(--jade)} .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#dfe8f2;transition:.25s}
  .toggle.on .knob{left:24px}
  .wave{height:30px;width:150px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
  .col{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:380px;
       transition:opacity .4s,border-color .4s,box-shadow .4s;opacity:.5}
  .col.working{opacity:1;border-color:var(--jade);box-shadow:0 0 0 1px var(--jade),0 6px 24px rgba(84,185,138,.14)}
  .col.done{opacity:.72} .col.waiting{opacity:.42}
  .badge{font-size:10.5px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600}
  .badge.working{color:var(--ink);background:var(--jade);border-color:var(--jade)}
  .badge.done{color:var(--jade);border-color:#2b4a3c}
  .badge.working i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:5px;animation:pulse 1.2s infinite;vertical-align:middle}
  .col h3{margin:0;padding:11px 14px;font-size:12px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line);
          display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--jade);font-size:11px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--jade);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .now{padding:13px 14px;border-bottom:1px solid var(--line);background:var(--panel2);min-height:74px;font-size:13px;color:#dfe7f0}
  .now .k{font-size:10.5px;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:5px}
  /* scroll region + "new updates" pill */
  .scrollwrap{position:relative;flex:1;display:flex;min-height:0}
  .hist{padding:6px 0;overflow-y:auto;width:100%;max-height:440px}
  .ev{padding:8px 14px;border-bottom:1px solid #1d2838}
  .ev .t{font-size:10.5px;color:var(--muted)} .ev .d{font-size:12.5px;margin-top:2px}
  .ev .n{font-size:11.5px;color:var(--muted);margin-top:3px}
  .ev .atom{font-size:11px;color:var(--amber);margin-top:3px}
  .pill{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:none;
        background:var(--cyan);color:var(--ink);font-weight:600;font-size:11.5px;border:none;border-radius:999px;
        padding:5px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .pill.show{display:block}
  /* Needs-Rez atoms (account/identity gates — his checklist) */
  .atoms{margin-top:12px;border:1px solid #3a3320;background:#1b1a12;border-radius:10px;padding:10px 14px}
  .ahead{font-size:11px;letter-spacing:.1em;color:var(--amber);font-weight:600;margin-bottom:6px}
  .acount{color:var(--muted);font-weight:400;letter-spacing:0;margin-left:6px}
  .atom{display:block;padding:6px 0;border-bottom:1px solid #2a2718}
  .atom:last-child{border-bottom:none}
  .atom .arow{display:flex;gap:10px;align-items:flex-start}
  .atom input{margin-top:3px;accent-color:var(--jade);width:15px;height:15px;cursor:pointer;flex:none}
  .atom .atxt{font-size:13px;color:#e5dcc4;line-height:1.4} .atom .asrc{font-size:10.5px;color:var(--muted);margin-left:auto;flex:none;padding-top:2px}
  .atom.done .atxt{text-decoration:line-through;color:var(--muted)}
  .howto{margin:5px 0 0 25px}
  .howto summary{font-size:11px;color:var(--jade);cursor:pointer;user-select:none;list-style:none;opacity:.85}
  .howto summary::-webkit-details-marker{display:none}
  .howto summary::before{content:'▸ steps to complete'}
  .howto[open] summary::before{content:'▾ steps to complete'}
  .howto summary{font-size:0}  /* hide the literal summary text; show only the ::before label */
  .howto summary::before{font-size:11px}
  .steps{position:relative;margin-top:6px}
  .steps pre{background:#11100a;border:1px solid #2a2718;border-radius:6px;padding:9px 11px;font-size:11.5px;color:#d9e8d2;white-space:pre-wrap;word-break:break-word;margin:0;font-family:ui-monospace,SFMono-Regular,monospace;line-height:1.55}
  .copybtn{position:absolute;top:6px;right:6px;background:#1b1a12;border:1px solid #3a3320;color:var(--muted);font-size:10px;padding:2px 8px;border-radius:5px;cursor:pointer}
  .copybtn:hover{color:var(--jade);border-color:var(--jade)}
  .completed{margin-top:10px;border-top:1px dashed #2a2718;padding-top:8px}
  .completed summary{font-size:11px;color:var(--muted);cursor:pointer;list-style:none;user-select:none}
  .completed summary::-webkit-details-marker{display:none}
  .completed summary::before{content:'▸ '} .completed[open] summary::before{content:'▾ '}
  .citem{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);padding:3px 0}
  .citem span:first-child{text-decoration:line-through;opacity:.85}
  .citem .t{font-size:10px;flex:none;padding-top:2px}
  .anone{color:var(--jade);font-size:12.5px;padding:2px 0}
  .btm{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
  .box{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}
  .box h4{margin:0;padding:11px 14px;font-size:12px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
  .box .scrollwrap{max-height:240px}
  .box .body{padding:8px 14px;overflow-y:auto;width:100%;max-height:240px}
  .lk{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-bottom:1px solid #1d2838;font-size:12.5px}
  .chip{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.ok{color:var(--jade);border-color:#2b4a3c} .chip.commit{color:var(--cyan);border-color:#234048}
  .feedline{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid #1d2838}
  .off{color:var(--muted);font-style:italic;padding:10px 0}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .stamp{color:var(--muted);font-size:11px}
  .paused{color:var(--amber);font-size:11px;display:none} .paused.show{display:inline}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}.btm{grid-template-columns:1fr}.lamps{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">GREY RIDGE<span class="r">·</span>LOOP</div>
    <div class="chain" id="chain"></div>
    <div class="lamps" id="lamps"></div>
    <div class="rev" id="rev"></div>
    <div class="mon">
      <span style="font-size:12px;color:var(--muted)">monitor</span>
      <div class="toggle" id="toggle" onclick="toggleMon()"><div class="knob"></div></div>
    </div>
  </div>

  <div class="atoms" id="atomsbox">
    <div class="ahead">NEEDS REZ — account / identity gates (not loop blockers)<span class="acount" id="acount"></span></div>
    <div id="atomlist"></div>
  </div>

  <div class="grid" id="agents"></div>

  <div class="btm">
    <div class="box">
      <h4>WORK SHIPPED</h4>
      <div class="scrollwrap"><div class="body" id="links"></div><button class="pill" data-k="links" onclick="jump('links')">↓ new</button></div>
    </div>
    <div class="box">
      <h4>MONITOR CONSOLE</h4>
      <div class="scrollwrap"><div class="body" id="feed"></div><button class="pill" data-k="feed" onclick="jump('feed')">↓ new</button></div>
    </div>
  </div>
  <div class="topbar">
    <span class="paused" id="paused">↑ scrolled up — live updates paused in this panel; click a “new” pill to catch up</span>
    <span class="stamp" id="stamp"></span>
  </div>
</div>

<script>
const AG=['research','builder','marketing'], LABEL={research:'RESEARCH · GM',builder:'BUILDER',marketing:'MARKETING'};
let monOn=false, built=false;
const counts={};  // scroll-id -> last item count

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function waveSVG(runs,rests){
  const seq=[]; const n=Math.max(runs.length,rests.length);
  for(let i=0;i<n;i++){ if(runs[i]!=null)seq.push({v:runs[i],k:'run'}); if(rests[i]!=null)seq.push({v:rests[i],k:'rest'}); }
  const s=seq.slice(-14); if(!s.length) return '';
  const W=150,Hh=30,max=Math.max(22,...s.map(x=>x.v)),step=W/Math.max(1,s.length-1);
  const pts=s.map((x,i)=>[i*step, Hh-(x.v/max)*(Hh-4)-2]);
  let d=''; pts.forEach((p,i)=>d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' ');
  const dots=s.map((x,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="2" fill="${x.k==='run'?'#54B98A':'#E8B04B'}"/>`).join('');
  return `<svg class="wave" viewBox="0 0 ${W} ${Hh}"><path d="${d}" fill="none" stroke="#5BC9D6" stroke-width="1.5" opacity=".85"/>${dots}</svg>`;
}

// Update a scroll panel IN PLACE: stick to bottom only if already at bottom; else keep
// the user's position and flash a "new" pill when fresh items arrive.
function setScroll(id, html, count){
  const el=document.getElementById(id); if(!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const prevTop = el.scrollTop, prev = counts[id]||0;
  el.innerHTML = html;
  const pill = el.parentElement.querySelector('.pill');
  if(atBottom){ el.scrollTop = el.scrollHeight; if(pill) pill.classList.remove('show'); }
  else { el.scrollTop = prevTop; if(pill && count>prev) pill.classList.add('show'); }
  counts[id]=count;
  reflectPaused();
}
function jump(id){ const el=document.getElementById(id); el.scrollTop=el.scrollHeight;
  const pill=el.parentElement.querySelector('.pill'); if(pill)pill.classList.remove('show'); reflectPaused(); }
function reflectPaused(){
  const any=[...document.querySelectorAll('.pill')].some(p=>p.classList.contains('show'));
  document.getElementById('paused').classList.toggle('show', any);
}

function buildSkeleton(){
  document.getElementById('agents').innerHTML = AG.map(a=>`
    <div class="col" id="col-${a}">
      <h3>${LABEL[a]} <span class="badge" id="badge-${a}">·</span></h3>
      <div class="now" id="now-${a}"><span class="k">NOW</span></div>
      <div class="scrollwrap"><div class="hist" id="hist-${a}"></div>
        <button class="pill" data-k="${a}" onclick="jump('hist-${a}')">↓ new updates</button></div>
    </div>`).join('');
  built=true;
}

function render(d){
  if(!built) buildSkeleton();
  // chain (no scroll — safe to replace)
  document.getElementById('chain').innerHTML = AG.map((a,i)=>
    `<span class="node ${d.engine.stage===a?'active':''}">${a}</span>${i<2?'<span class="arrow">▸</span>':''}`
  ).join('') + `<span class="arrow">▸</span><span class="node rest ${d.engine.stage==='rest'?'active':''}">rest ∿</span>`
    + ` <span style="color:var(--muted);font-size:11px" class="mono">pass ${d.engine.pass??'—'}</span>`;
  const h=d.health||{};
  const lamp=(id,el)=>`<div class="lamp ${h[id]&&h[id].ok?'on':''}" title="${esc(h[id]&&h[id].why)}">${el}</div>`;
  document.getElementById('lamps').innerHTML =
     lamp('green',`<span class="dot"></span><b>green</b>`)
   + lamp('super_green',`<span class="ring"></span><b>super-green</b>`)
   + `<div class="lamp ${h.ever_green&&h.ever_green.ok?'on':''}" title="${esc(h.ever_green&&h.ever_green.why)}">${waveSVG(d.rhythm.runs,d.rhythm.rests)||'<span class="dot"></span>'}<b>ever-green</b></div>`;
  const r=d.revenue||{}, pos=v=>v&&v>0?'pos':'';
  document.getElementById('rev').innerHTML =
    `<span>Line A <b class="mono ${pos(r.line_a_external_usdc)}">$${(r.line_a_external_usdc??0).toFixed(3)}</b> ext</span>`
   +`<span>Line B <b class="mono ${pos(r.line_b_fiat_usd)}">$${(r.line_b_fiat_usd??0).toFixed(2)}</b></span>`;
  // atoms — Rez's checklist (account/identity gates)
  const at=d.atoms||{open:[],cleared:[]};
  document.getElementById('acount').textContent = at.open.length?`· ${at.open.length} open`:'· clear';
  let ahtml=(at.open||[]).map(a=>atomRow(a,false)).join('') || '<div class="anone">✓ nothing needs you right now</div>';
  if((at.cleared_count||0)>0){
    const ci=(at.cleared||[]).slice().reverse().map(c=>`<div class="citem"><span>✓ ${esc(c.text)}</span><span class="t mono">${esc((c.ts||'').replace('T',' ').slice(0,16))}</span></div>`).join('');
    ahtml += `<details class="completed" ${openAtoms.has('__completed__')?'open':''} ontoggle="toggleAtom('__completed__',this.open)"><summary>✓ ${at.cleared_count} completed</summary>${ci}</details>`;
  }
  document.getElementById('atomlist').innerHTML = ahtml;
  // agents — NOW replaced freely; history updated IN PLACE (scroll preserved)
  const order=['research','builder','marketing'], cur=order.indexOf(d.engine.stage);
  AG.forEach((a,i)=>{
    const ag=d.agents[a]||{};
    // phase is driven by the ENGINE's real current stage — only ONE agent is ever "working"
    let phase,label;
    if(d.engine.stage===a){phase='working';label='<i></i>working';}
    else if(d.engine.stage==='rest'){phase='done';label='done';}
    else if(i<cur){phase='done';label='✓ handed off';}
    else {phase='waiting';label='waiting';}
    document.getElementById('col-'+a).className='col '+phase;
    const b=document.getElementById('badge-'+a); b.className='badge '+phase; b.innerHTML=label;
    const nowtxt = phase==='working' ? (esc(ag.now)||'working…')
                 : phase==='waiting' ? '<span class="off">waiting for its turn</span>'
                 : `<span class="off">handed off — ${esc((ag.now||'').slice(0,110))||'done this pass'}</span>`;
    document.getElementById('now-'+a).innerHTML = `<span class="k">NOW</span>${nowtxt}`;
    const chrono=(ag.history||[]).slice();  // oldest→newest (newest at bottom)
    const html = chrono.map(e=>`<div class="ev"><div class="t mono">${esc((e.ts||'').replace('T',' ').replace('Z',''))}</div>
      <div class="d">${esc(e.did)||'—'}</div>${e.next?`<div class="n">→ ${esc(e.next)}</div>`:''}
      ${e.atom&&!/^none/i.test(e.atom)?`<div class="atom">ATOM: ${esc(e.atom)}</div>`:''}</div>`).join('')
      || '<div class="off" style="padding:12px 14px">no history yet</div>';
    setScroll('hist-'+a, html, chrono.length);
  });
  // links
  const lhtml=(d.links||[]).map(l=>{
    const chip = l.type==='commit'?'<span class="chip commit">commit</span>':(l.verified?'<span class="chip ok">live ✓</span>':'<span class="chip">unverified</span>');
    const body = l.url?`<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`:`<span class="mono" style="font-size:11.5px">${esc(l.label)}</span>`;
    return `<div class="lk">${chip}${body}</div>`;
  }).join('')||'<div class="off">nothing shipped yet</div>';
  setScroll('links', lhtml, (d.links||[]).length);
  // monitor
  monOn = !!(d.monitor&&d.monitor.on);
  document.getElementById('toggle').className='toggle'+(monOn?' on':'');
  const feed=(d.monitor&&d.monitor.feed)||[];
  const fhtml = monOn
    ? (feed.map(f=>`<div class="feedline mono">${esc(f)}</div>`).join('')||'<div class="off">monitor on — first check pending…</div>')
    : '<div class="off">monitor off — hermes-self-heal is the floor</div>';
  setScroll('feed', fhtml, feed.length);
  document.getElementById('stamp').textContent = 'updated '+new Date(d.generated_at).toLocaleTimeString();
}

// which dropdowns are open — persisted so a 4s refresh never collapses them; stays until Rez minimizes or clears
const openAtoms = new Set((()=>{try{return JSON.parse(localStorage.getItem('openAtoms')||'[]')}catch(e){return []}})());
function _saveOpen(){ try{localStorage.setItem('openAtoms',JSON.stringify([...openAtoms]));}catch(e){} }
function toggleAtom(id,open){ if(open) openAtoms.add(id); else openAtoms.delete(id); _saveOpen(); }
function atomRow(a,done){
  const steps=(a.steps||[]);
  const drop = steps.length ? `<details class="howto" ${openAtoms.has(a.id)?'open':''} ontoggle="toggleAtom('${a.id}',this.open)"><summary>steps</summary><div class="steps"><button class="copybtn" onclick="copySteps(this)">copy all</button><pre>${esc(steps.join('\n'))}</pre></div></details>` : '';
  return `<div class="atom ${done?'done':''}"><div class="arow"><input type="checkbox" ${done?'checked':''} onchange="checkAtom('${a.id}',this.checked)"><span class="atxt">${esc(a.text)}</span><span class="asrc">${esc(a.agent)}</span></div>${drop}</div>`;
}
function copySteps(btn){ const pre=btn.parentElement.querySelector('pre'); navigator.clipboard.writeText(pre.textContent).then(()=>{const o=btn.textContent;btn.textContent='copied ✓';setTimeout(()=>btn.textContent=o,1200);}).catch(()=>{}); }
async function checkAtom(id,done){ try{ if(done){ openAtoms.delete(id); _saveOpen(); } await fetch('/api/atom',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,done})}); tick(); }catch(e){} }

async function tick(){ try{ const r=await fetch('/api/state',{cache:'no-store'}); render(await r.json()); }catch(e){} }
async function toggleMon(){ try{ await fetch('/api/monitor',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({on:!monOn})}); tick(); }catch(e){} }
tick(); setInterval(tick, 4000);
</script>
</body>
</html>
