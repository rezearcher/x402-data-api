name = "x402-data-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain on a zone we actually own.
# *.workers.dev is Cloudflare's domain, not ours, so we cannot create DNS records under
# it — which blocks any marketplace/registry step that asks for a DNS record to verify
# the origin (RapidAPI gateway DNS, MCP registry DNS-TXT ownership proof). Attaching the
# Worker to api.greyridgesignals.ai puts the origin on a zone where we control DNS, and
# reads as a real product rather than a dev endpoint. Cloudflare creates the DNS record
# and provisions the TLS cert automatically on deploy. The workers.dev URL keeps working,
# so every existing listing and the x402 Bazaar entry stay valid.
# MUST stay true, and MUST stay above [[routes]] — it is a top-level key, and TOML would
# otherwise swallow it into the routes table (deploy fails with "Expected routes to be an
# array..."). Declaring any route makes Wrangler disable workers.dev by DEFAULT, which
# silently 404s x402-data-api.sigrunner.workers.dev — the URL already baked into the x402
# Bazaar entry, mcp.so, the MCP registry submissions, llms.txt and every doc. Losing it
# would break live listings we cannot all edit. Both hostnames serve the same Worker.
workers_dev = true

[[routes]]
pattern = "api.greyridgesignals.ai"
custom_domain = true

[vars]
# Override PAY_TO in .dev.vars (local) or via `wrangler secret put PAY_TO` (deployed)
PAY_TO = "0x5765ae06a52dc7A0BB71c36A11db512c7ea9ed10"
FACILITATOR_URL = "https://facilitator.xpay.sh"
NETWORK = "eip155:8453"
# Live settlements go through xpay (proven, no ajv-on-Workers issue). CDP is used
# ONLY for the one-time Bazaar catalog seed via /internal/cdp-settle-raw (which
# bypasses the @x402 resource server). Setting this to "cdp" would break settle on
# DECLARED routes (ajv new Function blocked in Workers) — keep it "xpay".
FACILITATOR_MODE = "xpay"

# === REQUIRED Worker secrets (set via `wrangler secret put <NAME>`) ===
# CDP_API_KEY_ID          - CDP API Key ID for JWT auth with CDP x402 facilitator
# CDP_API_KEY_SECRET      - CDP API Key Secret (PEM or base64 private key) for JWT signing
# STRIPE_API_KEY          - (optional) Stripe secret key for recurring billing
# STRIPE_WEBHOOK_SECRET   - (optional) Stripe webhook signing secret
# STRIPE_PRICE_ID         - (optional) Stripe price ID for subscription tier

# KV namespace for API key storage (created via `wrangler kv namespace create API_KEYS`)
[[kv_namespaces]]
binding = "API_KEYS"
id = "b4862216375341f18f2aa6d58822c874"

# Durable Object for ATOMIC credit accounting (t_2a927f81).
# KV has no compare-and-swap, so the previous read-modify-write decrement in the
# middleware could double-spend a credit when two requests on the same key landed
# concurrently (both read N, both write N-1). The CreditLedger DO serializes
# check-and-decrement per key (one instance per key via idFromName(apiKey)), which
# makes each deduction atomic. KV remains the source of truth for key identity and
# expiry; the DO owns the credit balance once seeded.
[[durable_objects.bindings]]
name = "CREDIT_LEDGER"
class_name = "CreditLedger"

# Analytics Engine binding removed 2026-08-08: account entitlement not available.
# writeDataPoint is wrapped in try/catch (non-critical observability-only).
# Decision: remove binding + call rather than keep commented-out code.
# Reversible: add back if Rez enables Analytics Engine on account 9b5a408f758c052fd9ab99f5d0f32bea.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditLedger"]
# Required for routes declared with declareDiscoveryExtension to be catalogued in the Bazaar.
# Both must be present for CDP facilitator to activate; if absent, xpay is used (default).
#
# Obtain from https://portal.cdp.coinbase.com/access/api — create an API key with x402
# scope and download the private key (PEM or base64 ed25519).
#   CDP_API_KEY_ID: UUID format (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
#   CDP_API_KEY_SECRET: PEM-encoded private key or base64 ed25519 key material
