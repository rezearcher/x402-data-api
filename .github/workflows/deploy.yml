name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "wrangler.toml", "package.json"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Guard — no x402 resource.description over CDP 500-char settle limit
        run: python3 scripts/check_desc_limit.py
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9b5a408f758c052fd9ab99f5d0f32bea
      - name: refresh x402scan listing
        continue-on-error: true
        run: sleep 20 && node register_x402scan.js
