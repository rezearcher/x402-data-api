name: mcp-admission-gate
# Live example + canary for our published MCP tool-poisoning admission gate
# (the CI Action at rezearcher/greyridge-x402-tools). On every push to main and
# daily, we run the gate against a stable public MCP server as a smoke test:
# it proves the Action resolves and our hosted scanner is up, and it is a
# real, copy-pasteable `uses:` example of the gate in a workflow. Fails closed:
# a scan that can't run exits non-zero, so a broken scanner turns this red.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  admission-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Grey Ridge MCP admission gate against a public server
        id: gate
        uses: rezearcher/greyridge-x402-tools@v0.3.3
        with:
          url: https://mcp.deepwiki.com/mcp
      - name: Show the emitted README injection-security badge (copy-paste example)
        if: always()
        run: |
          echo "verdict=${{ steps.gate.outputs.verdict }} grade=${{ steps.gate.outputs.grade }} risk=${{ steps.gate.outputs.risk-score }}"
          echo "badge markdown -> ${{ steps.gate.outputs.badge-markdown }}"
